<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#030305" />
  <title>404 — Lost in the Night · NyxOS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M22 4a12 12 0 1 0 6 22A10 10 0 0 1 22 4Z' fill='%23a855f7'/><circle cx='12' cy='9' r='1.5' fill='%23c084fc'/><circle cx='23' cy='20' r='1.2' fill='%23e879f9'/></svg>" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; position: relative; z-index: 2; }
    .nf-inner { max-width: 34rem; }
    .nf-code {
      font-family: var(--font-hero); font-weight: 900; line-height: 1;
      font-size: clamp(5rem, 22vw, 11rem); letter-spacing: -4px; margin: 0;
      background: linear-gradient(120deg, var(--accent-purple-bright), var(--accent-purple-deep));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nf h1 { font-family: var(--font-display); font-size: clamp(1.3rem, 4vw, 1.8rem); margin: 0.6rem 0 0.8rem; color: var(--text-primary); }
    .nf p { color: var(--text-secondary); margin: 0 0 2rem; }
    .nf-actions { display: flex; gap: 0.85rem; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="ambient-grid" aria-hidden="true"></div>
  <div class="ambient-aurora" aria-hidden="true"></div>
  <main class="nf">
    <div class="nf-inner">
      <p class="nf-code">404</p>
      <h1>This page drifted into the night 🌙</h1>
      <p>The path you followed doesn't exist on NyxOS. Let's get you back to solid ground.</p>
      <div class="nf-actions">
        <a class="btn btn-primary btn-lg" href="/">Back home</a>
        <a class="btn btn-secondary btn-lg" href="https://github.com/kazah-png/nyx-os" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </main>
</body>
</html>
